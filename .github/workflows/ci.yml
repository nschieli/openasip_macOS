name: Build and Test

on:
  push:
    branches:
      - main
    # ⭐ A TAG BUILDS AND PUBLISHES. Verdon consumes the Linux prefix the same
    #    way Homebrew consumes the macOS one, and a package needs a URL that
    #    outlives the run: a workflow artifact expires in 30 days.
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - openasip-2.2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    # Only the release step needs this; scoped at the job because that is the
    # smallest unit GitHub allows.
    permissions:
      contents: write

    env:
      LLVM_VERSION: 22

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set environment variables
        run: |
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:${{ github.workspace }}/local/lib" >> $GITHUB_ENV
          echo "PATH=${{ github.workspace }}/local/bin:$PATH" >> $GITHUB_ENV
          echo "LDFLAGS=-L${{ github.workspace }}/local/lib" >> $GITHUB_ENV

          ## TMPDIR
          TMPDIR=$HOME/tmp
          echo "TMPDIR=$TMPDIR" >> $GITHUB_ENV
          mkdir -p $TMPDIR

      - name: Print envs
        run: |
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          echo "LDFLAGS=$LDFLAGS"
          echo "PATH=$PATH"
          echo "TMPDIR=$TMPDIR"

      - name: Install dependencies
        run: |
          # ⛔ THE RUNNER IMAGE PRECONFIGURES APT REPOSITORIES THIS PROJECT DOES
          #    NOT USE, AND ONE OF THEM CAN FAIL THE BUILD. 2026-09-09: Google
          #    served a Packages index whose hash did not match its own Release
          #    file; `apt-get update` exited 100 and the job died in 21 seconds,
          #    twice, without reaching a compiler.
          # ⇒ Remove what we never install from, so a third party's mirror
          #   cannot decide whether OpenASIP builds. Every package below comes
          #   from Ubuntu's own archive.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          sudo apt-get update
          sudo apt-get install -y \
            libwxgtk3.2-dev \
            libboost-all-dev \
            tcl8.6-dev \
            libedit-dev \
            libsqlite3-dev \
            sqlite3 \
            libxerces-c-dev \
            g++ \
            make \
            latex2html \
            libffi-dev \
            autoconf \
            automake \
            libtool \
            subversion \
            git \
            cmake \
            graphviz \
            bc \
            ghdl iverilog verilator \
            python3 ninja-build pkg-config libglib2.0-dev \
            libpixman-1-dev libslirp-dev flex bison file device-tree-compiler \
            zlib1g-dev libfdt-dev python3-tomli \
            gcc-riscv64-unknown-elf

          sudo apt-get purge -y 'llvm-*' 'clang-*' 'libllvm-*' 'lld-*'

      # ⚠ ADDED IN THIS FORK. The first CI run failed in the QEMU build with
      #   "error writing to /home/runner/tmp/ccHiNk1P.s: No space left on device"
      #   — not a QEMU defect, just disk exhaustion after a patched-LLVM build, an
      #   OpenASIP build and QEMU's 2736 objects on the same runner. The runner
      #   images carry large preinstalled toolchains none of this needs.
      # ⇒ Measured, not assumed: df is printed before and after so the reclaim is
      #   a number in the log rather than a belief.
      - name: Free disk space
        run: |
          echo "--- before ---"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "--- after ---"; df -h /

      - name: Create workspace directory
        run: |
          mkdir -p ${{ github.workspace }}/local

      - name: Restore LLVM cache
        id: llvm-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/local
          # ⛔ FIXED IN THIS FORK. This read
          #      hashFiles('openasip/tools/scripts/install_llvm_${{ env.LLVM_VERSION }}.sh')
          #    and a nested ${{ }} is NOT interpolated inside a hashFiles argument,
          #    so hashFiles matched no file and returned "". MEASURED in run 1's
          #    log: "Cache not found for input keys: Linux-llvm-" — the hash was
          #    empty and the key was a CONSTANT.
          # ⇒ A constant key never invalidates. Change the installer — as this fork
          #   does, to apply the i1 register-class patch — and CI silently keeps
          #   testing against an LLVM built without it. The failure is invisible:
          #   the cache hits, the build is green, and the compiler is the wrong one.
          # ⚠ The patch file is hashed too, so editing either invalidates.
          key: ${{ runner.os }}-llvm-${{ hashFiles('openasip/tools/scripts/install_llvm_22.sh', 'openasip/patches/llvm-22-i1-regclass-fallback.patch') }}

      - name: Install LLVM
        run: |
          if [[ "${{ steps.llvm-cache-restore.outputs.cache-hit }}" != "true" ]]; then
            echo "Cache not found. Installing LLVM..."
            cd openasip
            ./tools/scripts/install_llvm_${{ env.LLVM_VERSION }}.sh ${{ github.workspace }}/local
          else
            echo "Cache hit! LLVM ${{ env.LLVM_VERSION }} is already installed, skipping installation."
          fi

      - name: Save LLVM cache
        id: llvm-cache-save
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/local
          key: ${{ steps.llvm-cache-restore.outputs.cache-primary-key }}

      - name: Compile and install
        run: |
          cd openasip
          ./autogen.sh
          ./configure --prefix=${{ github.workspace }}/local
          make -j$(nproc)
          make install

      # ⚠ ADDED IN THIS FORK: continue-on-error. QEMU is used by the RISC-V flow
      #   only, and a failure here previously SKIPPED oa-selftest, the unit tests
      #   and the system tests — so one unrelated step took the whole signal with
      #   it. Those three are the ones this fork needs to certify, so they must
      #   not be gated on QEMU building.
      - name: Install QEMU-OpenASIP
        continue-on-error: true
        run: |
          cd openasip
          python3 ./tools/scripts/install_qemu.py $HOME/qemu-openasip

      - name: oa-selftest
        run: |
          oa-selftest -v -f

      - name: Unit tests
        run: |
          cd openasip/test
          make -s

      - name: System tests
        run: |
          python3 openasip/tools/scripts/systemtest.py -os -p$(nproc)

      # ════════════════════════════════════════════════════════════════════
      # Packaging for downstream (Verdon), mirroring ci-macos.yml.
      #
      # ⭐ AFTER the selftest, unit tests and systemtest, DELIBERATELY. An
      #    artifact survives a failed job, so packaging earlier would publish a
      #    binary nothing vouched for.
      # ⚠ LGPL v2.1 obliges us to make the corresponding source available
      #   alongside a distributed binary. It is this repository at the commit
      #   named in BUILD-INFO, which is why that file is written rather than
      #   assumed.
      # ════════════════════════════════════════════════════════════════════

      # ⛔ WHY AN env.sh AND NOT AN RPATH, AND IT IS A REAL DIFFERENCE FROM
      #    macOS. There, configure.ac rewrites libtool to emit @rpath plus
      #    -Wl,-rpath,@loader_path/../lib, so a moved tree runs with no
      #    environment at all. On Linux libopenasip.so records NO RUNPATH
      #    (measured: `objdump -x lib/libopenasip.so` shows none), so the
      #    library is found only via LD_LIBRARY_PATH.
      # ⇒ Shipping the env.sh INSIDE the prefix makes the archive
      #   self-describing without touching configure.ac: it resolves paths from
      #   its own location, so it is correct wherever the archive is unpacked.
      # ⚠ The alternative -- adding -Wl,-rpath,'$ORIGIN/../lib' -- would remove
      #   the need for it entirely and is the better long-term fix. It changes
      #   every Linux link line, so it is a separate decision, not a side effect
      #   of packaging.
      - name: Ship a relocatable env.sh inside the prefix
        run: |
          cat > ${{ github.workspace }}/local/env.sh <<'ENVSH'
          # OpenASIP + the patched LLVM it requires, from wherever this archive
          # was unpacked. Source it; do not edit paths into it.
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export PATH="$HERE/bin:$PATH"
          export LD_LIBRARY_PATH="$HERE/lib:${LD_LIBRARY_PATH:-}"
          export LDFLAGS="-L$HERE/lib"
          ENVSH
          cat ${{ github.workspace }}/local/env.sh

      # ⛔ BEFORE PACKAGING. This check exists to keep a non-relocatable tree off
      #    the download page; run after `Upload` it would only record that we
      #    shipped one.
      # ⚠ AND IT CANNOT BE CAUGHT ON A DEVELOPER BOX: installationDir() falls
      #   back to the compiled-in prefix, and on a machine that has ever
      #   installed there, THAT tree's data files satisfy the load -- so the test
      #   passes locally for a reason unrelated to the relocated tree.
      - name: Relocatable — move the tree and run from it
        run: |
          set -euo pipefail
          fail=0
          SRC=${{ github.workspace }}/local
          DST=${{ github.workspace }}/relocated
          mv "$SRC" "$DST"

          # 1. ⭐ A CLEAN ENVIRONMENT PLUS THE SHIPPED env.sh MUST SUFFICE.
          #    `env -i` so no PATH or LD_LIBRARY_PATH from the runner can mask a
          #    library that would be missing for a customer.
          # ⛔ TEST THE OUTPUT, NOT THE EXIT CODE. `generateprocessor --version`
          #    exits 1 while printing the right banner, so an exit-code check
          #    calls a working binary broken. The binary must print its OWN
          #    NAME, which it can only do after its library loaded.
          for b in ttasim generateprocessor; do
            out=$(cd / && env -i HOME="$HOME" bash -c ". $DST/env.sh; $b --version" 2>&1 || true)
            case "$out" in
              *"error while loading shared libraries"*)
                echo "::error::$b could not load its library from the relocated tree: $out"; fail=1 ;;
              *"$b"*)
                echo "  $b: $(echo "$out" | head -1)" ;;
              *)
                echo "::error::$b did not identify itself; got: $out"; fail=1 ;;
            esac
          done

          # 2. ⭐ THE NEGATIVE CONTROL, so the check above cannot pass vacuously.
          #    WITHOUT the env.sh the same binary must FAIL -- if it succeeds,
          #    something on the runner is providing the library and step 1 proved
          #    nothing about a customer's machine.
          out=$(cd / && env -i HOME="$HOME" bash -c "$DST/bin/ttasim --version" 2>&1 || true)
          case "$out" in
            *"error while loading shared libraries"*)
              echo "  control: without env.sh ttasim fails as expected" ;;
            *)
              echo "::error::ttasim ran WITHOUT the shipped env.sh -- the relocation check is not measuring what it claims: $out"; fail=1 ;;
          esac

          # 3. the prefix oracle must report where it now IS, not where it was
          #    built -- that is what tells every tool where its data files live.
          got=$(cd / && env -i HOME="$HOME" bash -c ". $DST/env.sh; openasip-config --prefix")
          [ "$got" = "$DST" ] || { echo "::error::openasip-config says '$got', expected '$DST'"; fail=1; }

          # 4. and a real data-path load, not just a version string.
          # ⛔⛔ TEST THE OUTPUT. ttasim EXITS 0 WHILE FAILING TO LOAD A MACHINE,
          #    so an exit-code check here prints a green directly beneath the
          #    failure it was meant to catch.
          # ⛔ A CLEAN LOAD PRINTS NOTHING, so this check is necessarily
          #    absence-of-error -- there is no `info` subcommand that reports a
          #    machine fact without a running simulation (measured: `info proc`
          #    says "No simulation running", `info machine`/`info buses` are
          #    unknown, `info regfiles`/`info funits` print nothing even on a
          #    good load). Two consequences, both handled below.
          adf=$(find "$DST/share" -name 'minimal*.adf' | head -1)
          out=$(cd / && env -i HOME="$HOME" bash -c ". $DST/env.sh; ttasim -e 'mach $adf; quit' < /dev/null" 2>&1 || true)
          case "$out" in
            # ⛔ (1) A DEAD BINARY MUST NOT PASS THIS CHECK. Without this arm the
            #    loader error falls through to `*)` and prints "ttasim loaded ..."
            #    over a ttasim that never started -- MEASURED while controlling
            #    this step by deleting libLLVMTCE.so: check 1 went red and this
            #    one still reported success. The macOS version has the same hole.
            *"error while loading shared libraries"*)
              echo "::error::ttasim did not even start, so this check proves nothing about data files: $out"; fail=1 ;;
            *"Unable to load machine"*|*"No schema file set"*|*"Illegal machine file"*)
              echo "::error::ttasim cannot load an ADF from the relocated tree -- it resolves its DATA files through the compiled-in prefix, not its own location."
              echo "::error::$out"
              fail=1 ;;
            *) echo "  ttasim loaded $(basename "$adf") from the relocated tree" ;;
          esac

          # ⭐ (2) AND THE PERTURBATION THAT MAKES THE ABOVE MEAN SOMETHING: a
          #    nonexistent ADF must be REJECTED. If it is not, the check is
          #    reading silence as success and would pass on a tree whose data
          #    files were unreachable.
          bad=$(cd / && env -i HOME="$HOME" bash -c ". $DST/env.sh; ttasim -e 'mach /nonexistent.adf; quit' < /dev/null" 2>&1 || true)
          case "$bad" in
            *"Unable to load machine"*) echo "  control: a nonexistent ADF is rejected, so the check above can fail" ;;
            *) echo "::error::a nonexistent ADF was NOT rejected -- the data-load check cannot fail and is not a control: $bad"; fail=1 ;;
          esac

          mv "$DST" "$SRC"
          [ "$fail" -eq 0 ] && echo "the installed tree is relocatable: linkage AND data files"
          exit $fail

      - name: Record what was built
        run: |
          cat > ${{ github.workspace }}/local/BUILD-INFO <<EOF
          repository : ${{ github.repository }}
          commit     : ${{ github.sha }}
          ref        : ${{ github.ref_name }}
          run        : ${{ github.run_id }}
          built      : $(date -u +%Y-%m-%dT%H:%M:%SZ)
          runner     : $(. /etc/os-release && echo "$PRETTY_NAME") $(uname -m)
          llvm       : ${LLVM_VERSION}

          Licensed LGPL v2.1. Corresponding source is the repository and commit
          above: https://github.com/${{ github.repository }}/tree/${{ github.sha }}
          EOF
          cat ${{ github.workspace }}/local/BUILD-INFO

      - name: Package the prefix
        run: |
          cd ${{ github.workspace }}
          tar -czf openasip-linux-x86_64.tar.gz local
          ls -lh openasip-linux-x86_64.tar.gz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openasip-linux-x86_64
          path: openasip-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Checksum
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd ${{ github.workspace }}
          sha256sum openasip-linux-x86_64.tar.gz > openasip-linux-x86_64.tar.gz.sha256
          cat openasip-linux-x86_64.tar.gz.sha256

      # ⛔ create-OR-upload, AND THAT IS NOT DEFENSIVENESS. ci-macos.yml
      #    publishes to the SAME tag. Whichever job reaches the tag second finds
      #    the release already there and `gh release create` fails, so a plain
      #    create would make enabling Linux releases break macOS publishing (or
      #    the reverse, depending on which finished first).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ${{ github.workspace }}
          cat > NOTES-linux.md <<'EOF'
          OpenASIP toolchain for Linux x86_64, built and self-tested by CI from a
          clean checkout on Ubuntu 24.04 LTS (stock).

          The archive expands to a `local/` prefix containing OpenASIP and the
          patched LLVM it requires. `local/BUILD-INFO` records the commit, the
          run and the runner.

          Put it on PATH by sourcing the env.sh inside it, which resolves paths
          from its own location:

              tar -xzf openasip-linux-x86_64.tar.gz
              . local/env.sh

          Licensed LGPL v2.1. The corresponding source is this repository at the
          commit named in BUILD-INFO.

          Verify:

              sha256sum -c openasip-linux-x86_64.tar.gz.sha256
          EOF
          ASSETS="openasip-linux-x86_64.tar.gz openasip-linux-x86_64.tar.gz.sha256"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OpenASIP ${GITHUB_REF_NAME}" \
            --notes-file NOTES-linux.md \
            $ASSETS \
          || gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber $ASSETS

      - name: What this job did and did not cover
        if: always()
        run: |
          echo "Covered : configure, build, install, oa-selftest, unit tests, systemtest.py, QEMU-OpenASIP (non-blocking), relocatability, and packaging on Ubuntu 24.04 x86_64 from a clean checkout."
          echo "NOT here: macOS/arm64 — see ci-macos.yml."
          echo "NOT here: the Verdon RTL swap. This artifact is the FORK's toolchain; verdon's own RTL is overlaid downstream by tools/build-product.sh."

      - name: Dump error logs
        if: failure()
        run: |
          if [ -f difference.txt ]; then
             echo "### systemtest difference.txt"
             cat difference.txt
          fi
